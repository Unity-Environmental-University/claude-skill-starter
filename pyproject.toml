[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-skill"
version = "0.1.0"
description = "Claude skill template - philosophy in structure, not docs"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
    # Add what you need:
    # "httpx>=0.27.0",  # For API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",  # Property-based testing
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["my_skill"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = false  # Types guide, don't constrain

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hypothesis settings for property-based tests
addopts = "--hypothesis-show-statistics"
